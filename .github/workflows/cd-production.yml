# ─────────────────────────────────────────────────────────────────────────────
# CD — Deploy to Production
# Triggers: push to `master` branch, or manual dispatch
# Requires manual approval via GitHub Environment "production"
# Tags release with semver from package.json
# ─────────────────────────────────────────────────────────────────────────────

name: CD Production

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to server after building images?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/memozi
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Build & Push images to GHCR ───────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:v${{ steps.version.outputs.VERSION }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:v${{ steps.version.outputs.VERSION }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Deploy to production server ───────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # Requires manual approval in GitHub repo settings
    permissions:
      contents: write
      packages: read
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == 'true')

    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/memozi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG="v${{ needs.build-and-push.outputs.version }}"
            docker compose -f docker-compose.prod.yml pull api frontend
            docker compose -f docker-compose.prod.yml up -d --no-deps api frontend
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy
            echo "Production deploy complete: $IMAGE_TAG"

      - name: Smoke test production
        run: |
          for i in 1 2 3 4 5; do
            sleep 15
            curl -fsk https://${{ secrets.PROD_API_DOMAIN }}/api/v1/health && echo "Smoke test passed!" && exit 0
            echo "Attempt $i failed, retrying..."
          done
          echo "Production smoke test failed after 5 attempts!" && exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-and-push.outputs.version }}
          name: Release v${{ needs.build-and-push.outputs.version }}
          generate_release_notes: true
