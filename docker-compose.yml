# ─────────────────────────────────────────────────────────────────────────────
# Docker Compose — Development Environment
#
# Services:
#   api      — Fastify backend with hot-reload (tsx watch)
#   postgres — PostgreSQL 16 database
#   redis    — Redis 7 (refresh token blacklist)
#   adminer  — Database UI at http://localhost:8080
#   grafana  — Monitoring dashboard at http://localhost:3001
#
# Usage:
#   docker compose up -d           # Start all services in background
#   docker compose logs -f api     # Follow API logs
#   docker compose exec api pnpm db:migrate   # Run migrations
#   docker compose exec api pnpm db:seed      # Seed HSK data
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: memozi
      POSTGRES_PASSWORD: memozidev
      POSTGRES_DB: memozi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memozi -d memozi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Fastify API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.dev
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://memozi:memozidev@postgres:5432/memozi?schema=public
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/backend/node_modules
      - /app/shared/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Adminer (DB UI) ──────────────────────────────────────────────────────────
  adminer:
    image: adminer:4-standalone
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
